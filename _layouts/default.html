<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}{% if page.title %} · {{ page.title }}{% endif %}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ "/assets/katex/katex.min.css" | relative_url }}">
  <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
</head>
<body>
  <header class="nav">
    <a class="logo" href="{{ "/" | relative_url }}">{{ site.title }}</a>
    <div class="nav-tools">
      <input id="search" type="search" placeholder="Search posts…" autocomplete="off" aria-label="Search posts">
      <button id="sort" type="button" title="Sort: oldest first" aria-label="Sort: oldest first" aria-pressed="false">
        <svg class="sort-icon sort-desc" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M20 12l-1.41-1.41L13 16.17V4h-2v12.17l-5.58-5.59L4 12l8 8 8-8z"/></svg>
        <svg class="sort-icon sort-asc" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true" hidden><path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z"/></svg>
      </button>
    </div>
  </header>

  <main class="content">
    {{ content }}
  </main>

  <footer class="footer">
    <p>© {{ site.author }} · {{ site.title }}. Content is licensed under a
    <a rel="license" href="https://creativecommons.org/licenses/by/4.0/">Creative Commons Attribution 4.0 International License</a>.</p>
  </footer>

  <script src="{{ "/assets/katex/katex.min.js" | relative_url }}"></script>
  <script src="{{ "/assets/katex/contrib/auto-render.min.js" | relative_url }}"></script>
  <script src="{{ "/assets/js/site.js" | relative_url }}"></script>
</body>
</html>
