<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logli Editor</title>
<style>
  :root { --border:#e8e8e8; --accent:#1a4f8b; --muted:#666; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #fff; color: #222;
    font-family: Georgia, 'FangSong', 'STFangsong', serif;
    font-size: 17px; line-height: 1.65;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 0.75rem 1.25rem;
    background: #fff; border-bottom: 1px solid var(--border);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header h1 { font-size: 1.35rem; margin: 0; margin-right: auto; font-weight: bold; color: #111; }
  .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  button {
    font: inherit; padding: 7px 14px; border: 1px solid #ccc;
    border-radius: 6px; background: #fff; color: #222; cursor: pointer;
  }
  button:hover { background: #f4f4f4; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #16406f; }
  button.danger { color: #c00; }
  #status { font-size: 13px; color: var(--muted); font-family: system-ui, sans-serif; }
  #status.error { color: #c00; }
  .layout { display: flex; min-height: calc(100vh - 60px); }
  aside {
    width: 280px; border-right: 1px solid var(--border);
    overflow-y: auto; max-height: calc(100vh - 60px); position: sticky; top: 60px;
  }
  aside ul { list-style: none; margin: 0; padding: 0; }
  aside li a {
    display: block; padding: 8px 14px; color: #222; text-decoration: none;
    border-bottom: 1px solid #f2f2f2; font-size: 13px; word-break: break-all;
    font-family: system-ui, sans-serif;
  }
  aside li a:hover { background: #f4f6fa; }
  aside li a.active { background: #e8eef7; border-left: 3px solid var(--accent); }
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .toolbar { display: none; padding: 8px 12px; border-bottom: 1px solid var(--border); font-family: system-ui, sans-serif; }
  .toolbar select { width: 100%; font: inherit; padding: 6px; }
  .view { max-width: 760px; margin: 0 auto; width: 100%; padding: 1.5rem 1.75rem 3rem; }
  .post-name { color: var(--muted); font-size: 0.8rem; font-family: system-ui, sans-serif; margin: 0 0 0.5rem; }
  .article h1, .article h2, .article h3, .article h4 { line-height: 1.3; margin: 1.5em 0 0.6em; }
  .article p, .article ul, .article ol, .article blockquote, .article pre, .article table { margin: 0 0 1em; }
  .article ul, .article ol { padding-left: 1.6em; }
  .article blockquote { margin-left: 0; padding-left: 1em; border-left: 3px solid #ddd; color: #444; }
  .article code { background: #f4f4f4; padding: 0.1em 0.35em; border-radius: 3px; font-size: 0.9em; }
  .article pre { background: #f6f6f6; padding: 0.9em 1.1em; border-radius: 6px; overflow-x: auto; }
  .article pre code { background: none; padding: 0; }
  .article a { color: var(--accent); }
  .article img { max-width: 80%; height: auto; }
  .article hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }
  .editor-wrap {
    flex: 1; min-height: 0; display: grid;
  }
  .editor-wrap > * {
    grid-area: 1 / 1;
    width: 100%; max-width: 860px; justify-self: center;
    margin: 0; padding: 1.25rem 1.75rem;
    font: 15px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre-wrap; word-wrap: break-word; overflow-wrap: break-word;
    tab-size: 4; border: 0; outline: none; overflow: auto;
  }
  .editor-wrap textarea {
    background: transparent; color: transparent; caret-color: #222;
    resize: none;
  }
  .editor-wrap textarea::placeholder { color: #999; opacity: 1; }
  .editor-wrap textarea::selection { color: #fff; background: #4078f2; }
  .editor-wrap pre { pointer-events: none; }
  .hljs { background: transparent; color: #333; padding: 0; }
  .hljs-section, .hljs-title, .hljs-keyword, .hljs-selector-tag, .hljs-meta,
  .hljs-bullet, .hljs-link_label, .hljs-regexp { color: #a626a4; }
  .hljs-section, .hljs-strong { font-weight: 700; }
  .hljs-string, .hljs-number, .hljs-literal, .hljs-symbol,
  .hljs-built_in, .hljs-type { color: #c18401; }
  .hljs-attr, .hljs-attribute, .hljs-variable, .hljs-template-variable { color: #986801; }
  .hljs-code, .hljs-link_url { color: #4078f2; text-decoration: underline; }
  .hljs-comment, .hljs-quote { color: #888; font-style: italic; }
  .hljs-emphasis { color: #222; font-style: italic; }
  .empty { color: var(--muted); text-align: center; padding-top: 20vh; font-family: system-ui, sans-serif; }
  @media (max-width: 640px) {
    aside { display: none; }
    .toolbar { display: block; }
    .view { padding: 1rem 1.1rem 2.5rem; }
    .editor-wrap > * { padding: 1rem 1.1rem; }
  }
</style>
</head>
<body>
<header>
  <h1>Logli Editor</h1>
  <div class="actions">
    <button id="new" class="primary">New</button>
    <button id="edit" hidden>Edit</button>
    <button id="save" class="primary" hidden>Save</button>
    <button id="upload" hidden>Upload image</button>
    <button id="del" class="danger" hidden>Delete</button>
    <span id="status"></span>
    <input type="file" id="file" accept="image/*" hidden>
  </div>
</header>
<div class="layout">
  <aside><ul id="posts"></ul></aside>
  <main>
    <div class="toolbar">
      <select id="pick" aria-label="Choose post"><option value="">-- choose post --</option></select>
    </div>
    <div id="view" class="view"></div>
    <div id="editorWrap" class="editor-wrap" hidden>
      <pre id="hl" aria-hidden="true"><code id="hlcode"></code></pre>
      <textarea id="content" placeholder="Write your post in Markdown…"></textarea>
    </div>
  </main>
</div>
<script src="markdown-it.min.js"></script>
<script src="highlight.min.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const md = window.markdownit({ html: false, linkify: true });
let current = null;
let raw = "";
let mode = "read";
let dirty = false;

async function api(path, opts = {}) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.status);
  return data;
}

function status(msg, isErr = false) {
  const el = $("#status");
  el.textContent = msg;
  el.className = isErr ? "error" : "";
}

function setMode(m) {
  mode = m;
  const editing = m === "edit";
  $("#view").hidden = editing;
  $("#editorWrap").hidden = !editing;
  $("#edit").hidden = editing || !current;
  $("#save").hidden = !editing;
  $("#upload").hidden = !editing;
  $("#del").hidden = !current;
  if (editing) { highlight(); $("#content").focus(); }
}

function highlight() {
  const ta = $("#content");
  const code = $("#hlcode");
  const html = window.hljs.highlight(ta.value, { language: "markdown" }).value;
  code.innerHTML = html + "\n";
  code.parentElement.scrollTop = ta.scrollTop;
}

function renderRead(name, content) {
  const src = content.replace(/\{\{\s*site\.baseurl\s*\}\}/g, "");
  $("#view").innerHTML =
    `<p class="post-name">${name}</p>` +
    `<article class="article">${md.render(src)}</article>`;
}

function showEmpty() {
  $("#view").innerHTML = `<div class="empty">Select a post, or click <strong>New</strong> to write one.</div>`;
}

async function refresh() {
  const { posts } = await api("/api/posts");
  $("#posts").innerHTML = posts.map((p) =>
    `<li><a href="#" data-name="${p}" class="${p === current ? "active" : ""}">${p}</a></li>`
  ).join("");
  $("#pick").innerHTML =
    '<option value="">-- choose post --</option>' +
    posts.map((p) => `<option value="${p}" ${p === current ? "selected" : ""}>${p}</option>`).join("");
}

function canLeave() {
  return !(mode === "edit" && dirty) || confirm("Discard unsaved edits?");
}

async function open(name) {
  if (!canLeave()) return;
  try {
    const { content } = await api("/api/posts/" + encodeURIComponent(name));
    current = name;
    raw = content;
    dirty = false;
    setMode("read");
    renderRead(name, content);
    status(name);
    refresh();
  } catch (e) { status(e.message, true); }
}

function edit() {
  if (!current || !canLeave()) return;
  dirty = false;
  $("#content").value = raw;
  setMode("edit");
  status("Editing " + current);
}

function newPost() {
  if (!canLeave()) return;
  current = null;
  raw = "";
  dirty = false;
  $("#content").value = "";
  setMode("edit");
  status("New post");
  refresh();
}

async function save() {
  const content = $("#content").value;
  if (!content.trim()) { status("Post is empty", true); return; }
  status("Pushing…");
  try {
    const data = current
      ? await api("/api/posts/" + encodeURIComponent(current), { method: "PUT", body: JSON.stringify({ content }) })
      : await api("/api/posts", { method: "POST", body: JSON.stringify({ content }) });
    current = data.name;
    raw = content;
    dirty = false;
    setMode("read");
    renderRead(current, content);
    status("Pushed \u2713 " + current);
    await refresh();
  } catch (e) { status(e.message, true); }
}

async function remove() {
  if (!current) return;
  if (!confirm("Delete " + current + "?")) return;
  status("Deleting…");
  try {
    await api("/api/posts/" + encodeURIComponent(current), { method: "DELETE" });
    current = null;
    raw = "";
    dirty = false;
    setMode("read");
    showEmpty();
    status("Deleted \u2713");
    await refresh();
  } catch (e) { status(e.message, true); }
}

function insertAtCursor(text) {
  const ta = $("#content");
  const start = ta.selectionStart;
  ta.value = ta.value.slice(0, start) + text + ta.value.slice(ta.selectionEnd);
  const pos = start + text.length;
  ta.setSelectionRange(pos, pos);
  dirty = true;
  highlight();
  ta.focus();
}

async function uploadImage(file) {
  const EXT2TYPE = { png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", gif: "image/gif", webp: "image/webp" };
  const type = file.type || EXT2TYPE[(file.name.split(".").pop() || "").toLowerCase()];
  if (!type) { status("Unsupported image type", true); return; }
  status("Uploading…");
  try {
    const res = await fetch("/api/images", { method: "POST", headers: { "Content-Type": type }, body: file });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || res.status);
    insertAtCursor("\n" + data.markdown + "\n");
    status("Image added \u2713 (pushes on Save)");
  } catch (e) { status(e.message, true); }
}

$("#posts").addEventListener("click", (e) => {
  const a = e.target.closest("a");
  if (a) { e.preventDefault(); open(a.dataset.name); }
});
$("#pick").addEventListener("change", (e) => { if (e.target.value) open(e.target.value); });
$("#content").addEventListener("input", () => { dirty = true; highlight(); });
$("#content").addEventListener("scroll", () => {
  $("#hlcode").parentElement.scrollTop = $("#content").scrollTop;
});
$("#content").addEventListener("paste", (e) => {
  const items = (e.clipboardData || {}).items || [];
  for (const it of items) {
    if (it.type && it.type.startsWith("image/")) {
      e.preventDefault();
      const file = it.getAsFile();
      if (file) uploadImage(file);
      return;
    }
  }
});
$("#upload").addEventListener("click", () => $("#file").click());
$("#file").addEventListener("change", (e) => {
  const f = e.target.files[0];
  if (f) uploadImage(f);
  e.target.value = "";
});
$("#new").addEventListener("click", newPost);
$("#edit").addEventListener("click", edit);
$("#save").addEventListener("click", save);
$("#del").addEventListener("click", remove);
setMode("read");
showEmpty();
refresh().catch((e) => status(e.message, true));
</script>
</body>
</html>
