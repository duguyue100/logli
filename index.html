---
layout: default
---

<section id="feed">
{% for post in paginator.posts %}
  {% assign n = paginator.page | minus: 1 | times: paginator.per_page | plus: forloop.index %}
  <article class="card" id="p{{ n }}">
    <div class="card-meta">
      <a class="card-date" href="#p{{ n }}" title="Permalink">{{ post.date | date: "%Y-%m-%d" }}</a>
      <button class="share" type="button" data-index="{{ n }}" aria-label="Share" title="Share">
        <svg class="share-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
        <svg class="check-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true" hidden><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
      </button>
    </div>
    <div class="card-body">
      {{ post.content }}
    </div>
  </article>
{% endfor %}
</section>

<div id="pagination" data-total="{{ paginator.total_pages }}" data-base="{{ site.baseurl }}">
  <button id="load-more" type="button">Load more</button>
  <button id="load-all" type="button">Load all</button>
</div>

<p id="no-results" class="no-results" hidden>No posts match your search.</p>
